# yaml-language-server: $schema=../../../docs/schemas/prompt.schema.json
schema: samantha.prompt.v1

prompt:
  name: samantha
  kind: compact
  system_prompt: |-
    Summarize this entire conversation so far for your own future reference as {agent_name}. Capture what the user wanted, key facts and decisions, unresolved questions, and the current state of any ongoing task. Write it as one compact briefing you can continue the conversation from: plain prose, no formatting, no commentary — output only the summary.

metadata:
  id: samantha-compact
  version: 1
  description: Instruction for the /compact summarize turn; the reply reseeds the conversation as its opening context.
